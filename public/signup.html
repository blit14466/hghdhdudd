 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - PenPalmega</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <a href="/" class="logo">PenPalmega</a>
    <div class="user-menu">
      <a href="/login.html" class="button button-small">Login</a>
      <a href="/signup.html" class="button button-small button-secondary">Sign Up</a>
    </div>
  </header>
  
  <nav>
    <a href="/">Home</a>
    <a href="/signup.html">Sign Up</a>
    <a href="/login.html">Login</a>
    <a href="/help.html">Help</a>
    <a href="/about.html">About Us</a>
  </nav>
  
  <main>
    <div class="container" style="max-width: 600px;">
      <h1>Create Your Account</h1>
      <p>Join our global community of pen pals</p>
      
      <form id="signupForm" class="form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="13" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country" required>
            <option value="">Select Country</option>
            <option value="US">United States</option>
            <option value="UK">United Kingdom</option>
            <!-- Add more countries as needed -->
          </select>
        </div>
        
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" required>
        </div>
        
        <div class="form-group">
          <label for="description">About You</label>
          <textarea id="description" name="description" rows="4"></textarea>
        </div>
        
        <button type="submit" class="button button-block">Create Account</button>
      </form>
      
      <script>
document.getElementById('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  // collect form values
  const data = {
    name:    document.getElementById('name').value,
    username:document.getElementById('username').value,
    email:   document.getElementById('email').value,
    password:document.getElementById('password').value,
    confirmPassword:document.getElementById('confirmPassword').value,
    country: document.getElementById('country').value,
    city:    document.getElementById('city').value,
    description: document.getElementById('description').value
  };
  const res = await fetch('/signup', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const json = await res.json();
  if (res.ok) {
    window.location.href = '/login.html';
  } else {
    alert(json.error);
  }
});
</script>

      
      <p style="text-align: center; margin-top: 1rem;">
        Already have an account? <a href="/login.html">Log in</a>
      </p>
    </div>
  </main>
  
  <footer>
    <div class="social-links">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
    <p>Contact: <a href="mailto:info@penpalmega.com">info@penpalmega.com</a></p>
    <p>&copy; 2023 PenPalmega. All rights reserved.</p>
  </footer>
  
  <script src="/script.js"></script>
</body>
</html>
