<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - PenPalmega</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <a href="/" class="logo">PenPalmega</a>
    <div class="user-menu">
      <button class="user-menu-btn">
        <span id="usernameDisplay">User</span>
        <i class="fas fa-caret-down"></i>
        <span id="notification-badge" class="notification-badge"></span>
      </button>
      <div class="user-dropdown">
        <a href="/userdashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/profile.html"><i class="fas fa-user"></i> My Profile</a>
        <a href="/messages.html"><i class="fas fa-envelope"></i> Messages <span id="messageNotifications"></span></a>
        <a href="/friends.html"><i class="fas fa-users"></i> Friends <span id="friendRequests"></span></a>
        <a href="/settings.html"><i class="fas fa-cog"></i> Settings</a>
        <a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </div>
  </header>
  
  <nav>
    <a href="/userdashboard.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="/find-penpals.html"><i class="fas fa-search"></i> Find Pen Pals</a>
    <a href="/messages.html"><i class="fas fa-envelope"></i> Messages</a>
    <a href="/news-updates.html"><i class="fas fa-newspaper"></i> News</a>
    <a href="/friends.html"><i class="fas fa-users"></i> Friends</a>
  </nav>
  
  <main>
    <div class="container">
      <h1>Edit Your Profile</h1>
      
      <div class="card">
        <form id="editProfileForm">
          <div class="grid grid-cols-2">
            <!-- Left Column -->
            <div class="profile-picture-section">
              <h2><i class="fas fa-camera"></i> Profile Picture</h2>
              <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview">
                  <img id="profilePreview" src="/images/default-avatar.png" alt="Current Profile Picture">
                </div>
                <div class="upload-controls">
                  <input type="file" id="profilePictureUpload" accept="image/*" class="hidden-upload">
                  <label for="profilePictureUpload" class="button button-small">
                    <i class="fas fa-upload"></i> Upload New
                  </label>
                  <button type="button" id="removePictureBtn" class="button button-small button-secondary">
                    <i class="fas fa-trash"></i> Remove
                  </button>
                </div>
              </div>
              
              <h2><i class="fas fa-user"></i> Basic Information</h2>
              <div class="form-group">
                <label for="editName">Full Name</label>
                <input type="text" id="editName" name="name" required>
              </div>
              
              <div class="form-group">
                <label for="editUsername">Username</label>
                <input type="text" id="editUsername" name="username" required>
                <small id="usernameAvailability"></small>
              </div>
              
              <div class="form-group">
                <label for="editAge">Age</label>
                <input type="number" id="editAge" name="age" min="13" max="120">
              </div>
              
              <div class="form-group">
                <label for="editGender">Gender</label>
                <select id="editGender" name="gender">
                  <option value="">Prefer not to say</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Non-binary">Non-binary</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            
            <!-- Right Column -->
            <div class="profile-details-section">
              <h2><i class="fas fa-globe"></i> Location</h2>
              <div class="form-group">
                <label for="editCountry">Country</label>
                <select id="editCountry" name="country">
                  <option value="">Select Country</option>
                  <option value="US">United States</option>
                  <option value="UK">United Kingdom</option>
                  <!-- More countries would be added here -->
                </select>
              </div>
              
              <div class="form-group">
                <label for="editCity">City</label>
                <input type="text" id="editCity" name="city">
              </div>
              
              <h2><i class="fas fa-heart"></i> Interests</h2>
              <div class="form-group">
                <label>Select Your Interests</label>
                <div class="interests-grid">
                  <label><input type="checkbox" name="interests" value="Reading"> Reading</label>
                  <label><input type="checkbox" name="interests" value="Travel"> Travel</label>
                  <label><input type="checkbox" name="interests" value="Music"> Music</label>
                  <label><input type="checkbox" name="interests" value="Sports"> Sports</label>
                  <label><input type="checkbox" name="interests" value="Cooking"> Cooking</label>
                  <label><input type="checkbox" name="interests" value="Photography"> Photography</label>
                  <label><input type="checkbox" name="interests" value="Gaming"> Gaming</label>
                  <label><input type="checkbox" name="interests" value="Art"> Art</label>
                  <label><input type="checkbox" name="interests" value="Technology"> Technology</label>
                  <label><input type="checkbox" name="interests" value="Languages"> Languages</label>
                </div>
              </div>
              
              <h2><i class="fas fa-language"></i> Languages</h2>
              <div class="form-group">
                <label>Select Languages You Speak</label>
                <div class="languages-grid">
                  <label><input type="checkbox" name="languages" value="English"> English</label>
                  <label><input type="checkbox" name="languages" value="Spanish"> Spanish</label>
                  <label><input type="checkbox" name="languages" value="French"> French</label>
                  <label><input type="checkbox" name="languages" value="German"> German</label>
                  <label><input type="checkbox" name="languages" value="Chinese"> Chinese</label>
                  <label><input type="checkbox" name="languages" value="Japanese"> Japanese</label>
                </div>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="editDescription">About You</label>
            <textarea id="editDescription" name="description" rows="5" 
                      placeholder="Tell potential pen pals about yourself..."></textarea>
            <small class="char-count"><span id="descriptionCount">0</span>/500 characters</small>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="button button-primary">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="/profile.html" class="button button-secondary">
              <i class="fas fa-times"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>
  
  <footer>
    <div class="social-links">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
    <p>Contact: <a href="mailto:info@penpalmega.com">info@penpalmega.com</a></p>
    <p>&copy; 2023 PenPalmega. All rights reserved.</p>
  </footer>
  
  <script src="/js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Load user data
      const user = await fetchUserData();
      if (!user) return;
      
      document.getElementById('usernameDisplay').textContent = user.name;
      
      // Load current profile data
      await loadProfileData(user._id);
      
      // Set up event listeners
      setupFormInteractions();
      
      // Set up logout
      document.getElementById('logout').addEventListener('click', async (e) => {
        e.preventDefault();
        await fetch('/logout', { method: 'GET' });
        window.location.href = '/login.html';
      });
    });
    
    async function fetchUserData() {
      try {
        const response = await fetch('/api/user');
        if (!response.ok) {
          window.location.href = '/login.html';
          return null;
        }
        return await response.json();
      } catch (err) {
        console.error('Error fetching user data:', err);
        window.location.href = '/login.html';
        return null;
      }
    }
    
    async function loadProfileData(userId) {
      try {
        const response = await fetch(`/api/user/${userId}`);
        if (!response.ok) throw new Error('Profile not found');
        
        const profile = await response.json();
        populateForm(profile);
      } catch (err) {
        console.error('Error loading profile:', err);
        alert('Error loading profile data');
      }
    }
    
    function populateForm(profile) {
      // Basic info
      document.getElementById('editName').value = profile.name || '';
      document.getElementById('editUsername').value = profile.username || '';
      document.getElementById('editAge').value = profile.age || '';
      document.getElementById('editGender').value = profile.gender || '';
      
      // Location
      document.getElementById('editCountry').value = profile.country || '';
      document.getElementById('editCity').value = profile.city || '';
      
      // About
      document.getElementById('editDescription').value = profile.description || '';
      updateCharCount();
      
      // Profile picture
      if (profile.profilePicture) {
        document.getElementById('profilePreview').src = profile.profilePicture;
      }
      
      // Interests
      if (profile.hobbies && profile.hobbies.length > 0) {
        profile.hobbies.forEach(hobby => {
          const checkbox = document.querySelector(`input[name="interests"][value="${hobby}"]`);
          if (checkbox) checkbox.checked = true;
        });
      }
      
      // Languages
      if (profile.languages && profile.languages.length > 0) {
        profile.languages.forEach(lang => {
          const checkbox = document.querySelector(`input[name="languages"][value="${lang}"]`);
          if (checkbox) checkbox.checked = true;
        });
      }
    }
    
    function setupFormInteractions() {
      // Profile picture upload
      document.getElementById('profilePictureUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            document.getElementById('profilePreview').src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
      
      // Remove picture
      document.getElementById('removePictureBtn').addEventListener('click', function() {
        document.getElementById('profilePreview').src = '/images/default-avatar.png';
        document.getElementById('profilePictureUpload').value = '';
      });
      
      // Username availability check
      document.getElementById('editUsername').addEventListener('blur', checkUsernameAvailability);
      
      // Description character count
      document.getElementById('editDescription').addEventListener('input', updateCharCount);
      
      // Form submission
      document.getElementById('editProfileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        await saveProfileChanges();
      });
    }
    
    async function checkUsernameAvailability() {
      const username = document.getElementById('editUsername').value.trim();
      const currentUsername = document.getElementById('usernameDisplay').textContent;
      
      if (!username || username === currentUsername) return;
      
      try {
        const response = await fetch(`/api/user/check-username?username=${username}`);
        const result = await response.json();
        
        const availabilityElement = document.getElementById('usernameAvailability');
        if (result.available) {
          availabilityElement.textContent = 'Username available!';
          availabilityElement.style.color = 'var(--success-color)';
        } else {
          availabilityElement.textContent = 'Username already taken';
          availabilityElement.style.color = 'var(--danger-color)';
        }
      } catch (err) {
        console.error('Error checking username:', err);
      }
    }
    
    function updateCharCount() {
      const textarea = document.getElementById('editDescription');
      const count = textarea.value.length;
      document.getElementById('descriptionCount').textContent = count;
      
      if (count > 500) {
        textarea.style.borderColor = 'var(--danger-color)';
      } else {
        textarea.style.borderColor = '';
      }
    }
    
    async function saveProfileChanges() {
      const form = document.getElementById('editProfileForm');
      const formData = new FormData();
      
      // Add all form data
      formData.append('name', document.getElementById('editName').value);
      formData.append('username', document.getElementById('editUsername').value);
      formData.append('age', document.getElementById('editAge').value);
      formData.append('gender', document.getElementById('editGender').value);
      formData.append('country', document.getElementById('editCountry').value);
      formData.append('city', document.getElementById('editCity').value);
      formData.append('description', document.getElementById('editDescription').value);
      
      // Add selected interests
      const interests = [];
      document.querySelectorAll('input[name="interests"]:checked').forEach(checkbox => {
        interests.push(checkbox.value);
      });
      formData.append('hobbies', JSON.stringify(interests));
      
      // Add selected languages
      const languages = [];
      document.querySelectorAll('input[name="languages"]:checked').forEach(checkbox => {
        languages.push(checkbox.value);
      });
      formData.append('languages', JSON.stringify(languages));
      
      // Add profile picture if changed
      const fileInput = document.getElementById('profilePictureUpload');
      if (fileInput.files[0]) {
        formData.append('profilePicture', fileInput.files[0]);
      } else if (document.getElementById('profilePreview').src.includes('default-avatar.png')) {
        formData.append('removePicture', 'true');
      }
      
      try {
        const response = await fetch('/api/user/profile', {
          method: 'PUT',
          credentials: 'include',
          body: formData
        });
        
        if (response.ok) {
          alert('Profile updated successfully!');
          window.location.href = '/profile.html';
        } else {
          const error = await response.text();
          throw new Error(error || 'Error updating profile');
        }
      } catch (err) {
        console.error('Error saving profile:', err);
        alert(err.message || 'Error updating profile');
      }
    }
  </script>
</body>
</html>
